name: geoprag_modules
description: Package flutter de todo o front end do GEOPRAG.
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_bloc: ^9.1.1
  pdf: ^3.12.0
  printing: ^5.14.3
  # Limite do image (vem do pdf): a 4.11 usa API do archive 4.0.10+, mas o
  # archive resolvido no Dart 3.9 do CI é o 4.0.9 e o código não compila.
  # Remover quando o CI subir de versão.
  image: '>=4.5.0 <4.11.0'

flutter:
  assets:
    - assets/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
