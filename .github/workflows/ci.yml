name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

defaults:
  run:
    working-directory: geoprag_modules_project

jobs:
  quality-gates:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        # TODO: tirar o continue-on-error quando os 37 testes hoje quebrados
        # na develop (todos com a mesma assinatura: Cubit não emite estado
        # Error nos testes de bloc_test) forem corrigidos. Até lá, test roda
        # e reporta, mas não bloqueia o merge.
        continue-on-error: true
        run: flutter test
